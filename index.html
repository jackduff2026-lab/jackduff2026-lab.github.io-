<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        :root {
            --neon-pink: #ff2e97;
            --neon-cyan: #00f0ff;
            --neon-purple: #b829ff;
            --neon-green: #39ff14;
            --dark-bg: #050508;
            --card-bg: #0f0f1a;
        }
        
        * { 
            font-family: 'Rajdhani', sans-serif; 
            box-sizing: border-box;
        }
        
        h1, h2, h3, h4 { font-family: 'Orbitron', sans-serif; }
        
        body {
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(184,41,255,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,240,255,0.08) 0%, transparent 50%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .neon-text {
            text-shadow: 
                0 0 5px var(--neon-cyan),
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan);
        }
        
        .neon-pink-text {
            text-shadow: 
                0 0 5px var(--neon-pink),
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink);
        }
        
        .neon-green-text {
            text-shadow: 
                0 0 5px var(--neon-green),
                0 0 10px var(--neon-green),
                0 0 20px var(--neon-green);
        }
        
        .neon-border {
            border: 1px solid rgba(0,240,255,0.3);
            box-shadow: 
                0 0 8px rgba(0,240,255,0.2),
                inset 0 0 8px rgba(0,240,255,0.1);
        }
        
        .neon-border-pink {
            border: 1px solid rgba(255,46,151,0.3);
            box-shadow: 
                0 0 8px rgba(255,46,151,0.2),
                inset 0 0 8px rgba(255,46,151,0.1);
        }
        
        .neon-btn {
            background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(184,41,255,0.15));
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0,240,255,0.3);
            transition: all 0.3s ease;
        }
        
        .neon-btn:hover {
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0,240,255,0.2);
            transform: translateY(-2px);
        }
        
        .neon-btn-pink {
            background: linear-gradient(135deg, rgba(255,46,151,0.15), rgba(184,41,255,0.15));
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 10px rgba(255,46,151,0.3);
        }
        
        .neon-btn-pink:hover {
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px rgba(255,46,151,0.2);
        }
        
        .neon-card {
            background: rgba(15,15,26,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,240,255,0.2);
            box-shadow: 
                0 0 15px rgba(0,240,255,0.1),
                0 0 30px rgba(184,41,255,0.05);
            transition: all 0.3s ease;
        }
        
        .neon-card:hover {
            border-color: rgba(0,240,255,0.5);
            box-shadow: 
                0 0 25px rgba(0,240,255,0.2),
                0 0 50px rgba(184,41,255,0.1);
            transform: translateY(-5px);
        }
