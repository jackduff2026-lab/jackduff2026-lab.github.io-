<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- CYBERPUNK FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyber-black: #05010d;
            --cyber-dark: #0d0221;
            --cyber-card: #12052e;
            --neon-cyan: #00fff5;
            --neon-pink: #ff2a6d;
            --neon-purple: #b000ff;
            --neon-text: #e8f9ff;
        }
        * {
            font-family: 'Rajdhani', sans-serif;
            color: var(--neon-text);
        }
        body {
            background: var(--cyber-black);
            background-image: 
                radial-gradient(circle at top, rgba(176,0,255,0.08) 0%, transparent 50%),
                radial-gradient(circle at bottom left, rgba(0,255,245,0.06) 0%, transparent 50%);
            min-height: 100vh;
        }
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }
        .cyber-logo {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(0,255,245,0.5)) drop-shadow(0 0 16px rgba(176,0,255,0.3));
            letter-spacing: 0.15em;
        }
        .cyber-card {
            background: linear-gradient(135deg, rgba(13,2,33,0.9), rgba(18,5,46,0.8));
            border: 1px solid rgba(0,255,245,0.2);
            box-shadow: 
                0 0 15px rgba(0,255,245,0.1),
                inset 0 0 30px rgba(0,255,245,0.03);
            transition: all 0.3s ease;
        }
        .cyber-card:hover {
            border-color: rgba(255,42,109,0.4);
            box-shadow: 
                0 0 25px rgba(255,42,109,0.2),
                inset 0 0 40px rgba(255,42,109,0.05);
            transform: translateY(-3px);
        }
        .cyber-btn {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 12px rgba(0,255,245,0.4);
            transition: all 0.3s ease;
        }
        .cyber-btn:hover {
            box-shadow: 0 0 25px rgba(0,255,245,0.7), 0 0 40px rgba(176,0,255,0.4);
            transform: scale(1.03);
        }
        .cyber-btn-outline {
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0,255,245,0.2) inset;
            transition: all 0.3s ease;
        }
        .cyber-btn-outline:hover {
            background: rgba(0,255,245,0.15);
            box-shadow: 0 0 15px rgba(0,255,245,0.4);
        }
        .cyber-border {
            position: relative;
        }
        .cyber-border::before,
        .cyber-border::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-cyan);
        }
        .cyber-border::before {
            top: -1px; left: -1px;
            border-right: none; border-bottom: none;
        }
        .cyber-border::after {
            bottom: -1px; right: -1px;
            border-left: none; border-top: none;
            border-color: var(--neon-pink);
        }
        .slide { display: none; }
        .slide.active { display: block; animation: cyberFade 0.4s ease; }
        @keyframes cyberFade {
            from { opacity: 0; filter: brightness(1.5); }
            to { opacity: 1; filter: brightness(1); }
        }
        .cart-badge { top: -6px; right: -6px; }
        .price-neon {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0,255,245,0.5);
        }
        .scanline {
            background: linear-gradient(transparent 50%, rgba(0,0,0,0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative">
    <!-- Scanline Overlay -->
    <div class="fixed inset-0 scanline z-0 opacity-30"></div>

<!-- Navigation -->
<nav class="relative z-10 backdrop-blur-md border-b border-cyan-500/20 bg-black/40">
