        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');
        :root {
            --neon-pink: #ff2e97;
            --neon-cyan: #00f0ff;
            --dark-bg: #050508;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
        }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }
        .neon-cyan { text-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan); color: var(--neon-cyan); }
        .neon-pink { text-shadow: 0 0 8px var(--neon-pink), 0 0 15px var(--neon-pink); color: var(--neon-pink); }
        .nav-bar {
            position: sticky; top: 0;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid rgba(0,240,255,0.2);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }
        .cart-icon { position: relative; cursor: pointer; }
        .cart-badge {
            position: absolute; top: -8px; right: -8px;
            background: var(--neon-pink); color: white;
            font-size: 11px; width: 18px; height: 18px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .product-card {
            background: rgba(20,20,35,0.8);
            border: 1px solid rgba(0,240,255,0.25);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }
        .product-card:hover { border-color: var(--neon-cyan); transform: translateY(-3px); }
        
        /* SLIDESHOW */
        .slideshow {
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
            background: #111;
        }
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slide.active { display: block; animation: fade 0.5s ease; }
        @keyframes fade { from {opacity: 0.4;} to {opacity: 1;} }
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .slide-btn:hover { background: rgba(0,240,255,0.5); }
        .prev { left: 10px; }
        .next { right: 10px; }
        .slide-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
        }
        .dot.active { background: var(--neon-cyan); box-shadow: 0 0 6px var(--neon-cyan); }
        
        .btn {
            padding: 10px 16px; border-radius: 8px; border: none;
            font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-cyan { background: rgba(0,240,255,0.15); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
