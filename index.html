<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      min-height: 100vh;
      padding: 20px;
      color: #fff;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Header & Animated Neon Logo */
    header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
      padding-top: 10px;
    }
    .logo {
      font-size: 3.8rem;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(90deg, #00f0ff, #8b5cf6, #ff2d92);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neonGlow 3s linear infinite;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5)) 
              drop-shadow(0 0 20px rgba(139, 92, 246, 0.3));
      margin-bottom: 8px;
    }
    @keyframes neonGlow {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    .subtitle { 
      color: #94a3b8; 
      font-size: 1rem; 
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    
    /* 🛒 Cart Icon Button */
    .cart-btn {
      position: absolute;
      right: 0;
      top: 15px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border: none;
      padding: 10px 14px;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cart-btn:hover { 
      transform: scale(1.05); 
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
    }
    .cart-icon { font-size: 1.3rem; line-height: 1; }
    .cart-count {
      background: #ef4444;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Product Cards */
    .product-card {
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      margin-bottom: 30px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s, border-color 0.3s;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, 0.3);
    }
    .image-gallery {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding: 20px;
      background: rgba(255,255,255,0.03);
    }
    .image-gallery::-webkit-scrollbar { height: 5px; }
    .image-gallery::-webkit-scrollbar-thumb { 
      background: linear-gradient(90deg, #6366f1, #8b5cf6); 
      border-radius: 3px; 
    }
    .product-img {
      flex: 0 0 240px;
      height: 160px;
      border-radius: 14px;
      overflow: hidden;
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-img:hover img { transform: scale(1.05); }
    .scroll-hint {
      color: #6b7280;
      font-size: 0.8rem;
      padding: 0 25px 10px;
    }
    .product-info { padding: 25px; }
    .product-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .price {
      font-size: 1.5rem;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 14px;
    }
    .description {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .add-btn {
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border: none;
      padding: 14px;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    /* Cart Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1a1a2e;
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(139, 92, 246, 0.2);
      padding: 30px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .modal-header h2 {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-btn:hover { color: #fff; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .item-info h4 { margin-bottom: 4px; }
    .item-info p { color: #a5b4fc; font-weight: 600; }
    .remove-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .remove-btn:hover { background: #dc2626; }
    .cart-total {
      margin-top: 20px;
      text-align: right;
      font-size: 1.4rem;
      font-weight: 700;
      color: #a5b4fc;
    }
    .checkout-btn {
      width: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      border: none;
      padding: 16px;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 25px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .checkout-btn:hover { box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }
    .empty-cart {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    /* Payment Form */
    .payment-form { margin-top: 25px; display: none; }
    .payment-form.active { display: block; }
    .payment-form h3 { margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #8b5cf6;
    }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .submit-payment {
      width: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      border: none;
      padding: 16px;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .submit-payment:hover { box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }
    .success-msg {
      display: none;
      text-align: center;
      padding: 30px;
      color: #10b981;
    }
    .success-msg.active { display: block; }
    .success-msg h2 { font-size: 2rem; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">VYRO</div>
    <button class="cart-btn" onclick="openCart()">
      <span class="cart-icon">🛒</span>
      <span class="cart-count" id="cartCount">0</span>
    </button>
    <p class="subtitle">Curated Essentials</p>
  </header>
