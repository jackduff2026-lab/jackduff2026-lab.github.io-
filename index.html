<html lang="en">
<head>

    <title>VYRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        :root {
            --neon-pink: #ff2e97;
            --neon-cyan: #00f0ff;
            --neon-purple: #b829ff;
            --dark-bg: #050508;
        }
        
        * { font-family: 'Rajdhani', sans-serif; box-sizing: border-box; }
        h1, h2, h3, h4 { font-family: 'Orbitron', sans-serif; }
        
        body {
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(184,41,255,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,240,255,0.08) 0%, transparent 50%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .neon-text { text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
        .neon-pink-text { text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        
        .neon-btn {
            background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(184,41,255,0.15));
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0,240,255,0.3);
            transition: all 0.3s ease;
        }
        .neon-btn:hover { box-shadow: 0 0 20px var(--neon-cyan); transform: translateY(-2px); }
        
        .neon-btn-pink {
            background: linear-gradient(135deg, rgba(255,46,151,0.2), rgba(184,41,255,0.15));
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 10px rgba(255,46,151,0.3);
        }
        .neon-btn-pink:hover { box-shadow: 0 0 20px var(--neon-pink); transform: translateY(-2px); }
        
        .neon-card {
            background: rgba(15,15,26,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,240,255,0.2);
            box-shadow: 0 0 15px rgba(0,240,255,0.1);
            transition: all 0.3s ease;
        }
        .neon-card:hover { border-color: rgba(0,240,255,0.5); box-shadow: 0 0 25px rgba(0,240,255,0.2); transform: translateY(-5px); }
        
        .slideshow-container { position: relative; overflow: hidden; background: #111; min-height: 280px; }
        .slide { display: none; }
        .slide.active { display: block; animation: fade 0.5s ease; }
        @keyframes fade { from {opacity:0.4;} to {opacity:1;} }
        
        .cart-badge {
            position: absolute; top: -6px; right: -6px;
            background: var(--neon-pink); color: white;
            border-radius: 50%; width: 18px; height: 18px;
            font-size: 11px; display: flex; align-items: center; justify-content: center;
        }
        
        input {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0,240,255,0.3);
            color: white; padding: 10px 14px; border-radius: 8px; outline: none; width: 100%;
        }
        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3); }
